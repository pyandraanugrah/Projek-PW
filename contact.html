<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACICU - Contact</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navigation-bar">
    <div class="nav-item">
      <div class="logo">
        <img src="src/logo.jpg" alt="ACICU" />
      </div>
      <div class="nav-text">
        <h2>ACICU</h2>
        <p>Aneka Aci Bungcu</p>
      </div>
    </div>

    <nav class="nav-list" aria-label="Navigasi utama">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="menu.html">Menu</a>
      <a class="nav-link" href="about.html">About Us</a>
      <a class="nav-link is-active" href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="page-main">
    <section class="page-hero page-hero--contact">
      <h1 class="page-title">Contact</h1>
      <p class="page-subtitle">Kamu bisa hubungi kami</p>

      <div class="contact-wrap">
        <form class="contact-card" id="contactForm" autocomplete="off">
          <label class="field">
            <span class="field-label">Nama</span>
            <input class="field-input" type="text" name="name" placeholder="Masukkan nama" required />
          </label>

          <label class="field">
            <span class="field-label">No. HP</span>
            <input class="field-input" type="tel" name="phone" placeholder="08xxxxxxxxxx" required />
          </label>

          <label class="field">
            <span class="field-label">Pesan</span>
            <textarea class="field-input field-textarea" name="message" rows="5" placeholder="Tulis pesan..." required></textarea>
          </label>

          <button class="contact-btn" type="submit">Kirim Pesan</button>

          <p class="contact-note" id="contactNote" aria-live="polite"></p>
        </form>

        <div class="contact-side" aria-label="Info kontak">
          <div class="side-card">
            <h2 class="side-title">Alamat</h2>
            <p class="side-text">Boleh isi alamat toko kamu di sini.</p>
          </div>

          <div class="side-card">
            <h2 class="side-title">Jam Operasional</h2>
            <p class="side-text">Setiap hari • 09.00 - 20.00</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
